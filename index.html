<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر غمرة للعبايات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style> 
        body { font-family: 'Tajawal', sans-serif; background-color: #f9fafb; padding-bottom: 120px; }
        .hero-banner { position: relative; width: 100%; height: 350px; background-color: #000; overflow: hidden; }
        .hero-banner img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .category-title { border-right: 4px solid #800020; padding-right: 10px; margin: 25px 15px; font-weight: bold; color: #374151; }
        
        /* خيارات المنتج */
        .opt-btn { border: 1px solid #e5e7eb; transition: all 0.2s; background: white; cursor: pointer; }
        .opt-btn.selected { border: 2px solid #800020 !important; background-color: #fff5f5 !important; font-weight: bold; }
        
        #productDetailModal, #cartDrawer, #orderModal { display: none; }
        .modal-open { overflow: hidden; }
    </style>
</head>
<body>

    <header class="bg-white text-gray-800 p-4 sticky top-0 z-50 text-center shadow-sm border-b">
        <h1 class="text-xl font-bold">GHAMRA | غمرة</h1>
    </header>

    <div class="hero-banner">
        <img src="4.png" alt="عيد كولكشن">
        <div class="absolute inset-0 flex flex-col justify-center items-center text-white text-center">
            <h2 class="text-xl font-bold mb-1 tracking-widest">NEW COLLECTION</h2>
            <p class="text-sm opacity-90 mb-6">عبايات غمرة كولكشن العيد..</p>
            <a href="#products" class="border border-white px-8 py-2 rounded-full text-sm">عرض الكل</a>
        </div>
    </div>

    <main class="max-w-md mx-auto px-4" id="products">
        <h2 class="category-title text-xl font-bold text-right my-6">عبايات سوداء كلاسيك</h2>
        
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 p-2 cursor-pointer" 
                 onclick="openProductDetail('عباية دانتيل رسمية', 500, 379, ['5.png', '6.png'], 'عباية دانتيل ملكي، تتميز بتصميم رسمي وأنيق يناسب المناسبات والدوام.')">
                <img src="5.png" class="w-full h-56 object-cover rounded-xl">
                <div class="p-3 text-right">
                    <h3 class="text-xs font-bold text-gray-700 truncate">عباية دانتيل رسمية</h3>
                    <div class="flex gap-2 items-center mt-1 justify-end">
                        <span class="text-red-600 font-bold text-sm">379 ريال</span>
                        <span class="text-gray-400 line-through text-[10px]">500 ريال</span>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 p-2 cursor-pointer" 
                 onclick="openProductDetail('عباية تطريز كلاسيك', 500, 320, ['5.png', '6.png'], 'عباية كلاسيكية بتطريز يدوي ناعم على الأكمام، قصة مريحة.')">
                <img src="5.png" class="w-full h-56 object-cover rounded-xl">
                <div class="p-3 text-right">
                    <h3 class="text-xs font-bold text-gray-700 truncate">عباية تطريز كلاسيك</h3>
                    <div class="flex gap-2 items-center mt-1 justify-end">
                        <span class="text-red-600 font-bold text-sm">320 ريال</span>
                        <span class="text-gray-400 line-through text-[10px]">500 ريال</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="productDetailModal" class="fixed inset-0 z-[9999] bg-white overflow-y-auto">
        <div class="max-w-md mx-auto min-h-screen pb-20 p-6">
            <div onclick="closeProductDetail()" class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center cursor-pointer mb-4">
                <i class="fas fa-chevron-right"></i>
            </div>
            <div class="flex overflow-x-auto snap-x h-80 bg-gray-50 rounded-2xl mb-6" id="modalSlider"></div>
            <div class="text-right">
                <h2 id="modalTitle" class="text-2xl font-bold mb-2"></h2>
                <div class="flex gap-3 justify-end items-center mb-6">
                    <span id="modalPrice" class="text-red-600 text-2xl font-bold"></span>
                    <span id="modalOldPrice" class="text-gray-400 line-through text-sm"></span>
                </div>
                <p id="productDescription" class="text-gray-600 text-sm mb-6 bg-gray-50 p-3 rounded-lg"></p>
                
                <label class="block font-bold mb-2 text-sm">المقاس *</label>
                <div id="sizeOptions" class="flex flex-wrap gap-2 justify-end mb-6"></div>

                <label class="block font-bold mb-2 text-sm">نوع القفلة *</label>
                <div class="flex gap-2 mb-6">
                    <button onclick="selectOption('wrap', 'لف', this)" class="opt-btn flex-1 py-3 rounded-xl text-xs">لف</button>
                    <button onclick="selectOption('wrap', 'أزرار', this)" class="opt-btn flex-1 py-3 rounded-xl text-xs">إضافة أزرار</button>
                </div>

                <label class="block font-bold mb-2 text-sm">الطرحة *</label>
                <div class="flex gap-2 mb-6">
                    <button onclick="selectOption('veil', 'سادة', this)" class="opt-btn flex-1 py-3 rounded-xl text-xs">سادة (مجاناً)</button>
                    <button onclick="selectOption('veil', 'مطرزة', this)" class="opt-btn flex-1 py-3 rounded-xl text-xs">مطرزة (+19 ريال)</button>
                </div>

                <textarea id="itemNote" placeholder="ملاحظات (مثل: تقصير انش)" class="w-full border p-3 rounded-xl bg-gray-50 h-20 text-right mb-6 outline-none text-sm"></textarea>
                
                <button id="modalAddBtn" class="w-full bg-black text-white py-4 rounded-2xl font-bold shadow-lg">إضافة للسلة</button>
            </div>
        </div>
    </div>

    <div class="fixed bottom-[180px] left-6 bg-[#800020] text-white w-14 h-14 rounded-full flex items-center justify-center shadow-xl z-[1000] cursor-pointer" onclick="toggleCartDrawer()">
        <i class="fas fa-shopping-bag"></i>
        <span id="cartCount" class="absolute -top-1 -right-1 bg-red-600 text-[10px] rounded-full px-2">0</span>
    </div>

    <div id="cartDrawer" class="fixed bottom-[100px] left-4 right-4 bg-white z-[2000] rounded-2xl shadow-2xl flex flex-col border max-h-[50vh]">
        <div class="p-4 border-b flex justify-between items-center font-bold">
            <span>سلة المشتريات</span>
            <button onclick="toggleCartDrawer()" class="text-xl">×</button>
        </div>
        <div id="cartItemsList" class="overflow-y-auto p-4 flex-1 text-right text-sm"></div>
        <div class="p-4 border-t flex justify-between font-bold">
            <span>الإجمالي:</span>
            <span class="text-[#800020]"><span id="inner-total">0</span> ريال</span>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white p-4 shadow-2xl border-t z-50 max-w-md mx-auto">
        <div class="flex justify-between mb-4 font-bold px-2">
            <span class="text-gray-400">الإجمالي النهائي:</span>
            <span><span id="total-price">0</span> ريال</span>
        </div>
        <button onclick="openOrderModal()" class="w-full bg-black text-white py-4 rounded-xl font-bold">إتمام الطلب</button>
    </div>

    <div id="orderModal" class="fixed inset-0 bg-black/70 z-[10000] flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-3xl w-full max-w-sm text-right">
            <h3 class="font-bold mb-4">بيانات التوصيل 🚚</h3>
            <input type="text" id="custName" placeholder="الاسم" class="w-full p-3 border rounded-xl mb-3 outline-none">
            <input type="tel" id="custPhone" placeholder="رقم الجوال 05xxxxxxxx" class="w-full p-3 border rounded-xl mb-3 outline-none">
            <div class="flex gap-2 mb-3">
                <button onclick="setPay('transfer')" id="btnT" class="flex-1 border p-3 rounded-xl text-xs">تحويل بنكي</button>
                <button onclick="setPay('cod')" id="btnC" class="flex-1 border p-3 rounded-xl text-xs">دفع عند الاستلام</button>
            </div>
            <button id="gpsBtn" onclick="getGPS()" class="w-full p-3 border-dashed border-2 border-green-500 text-green-600 rounded-xl mb-4 text-xs">📍 مشاركة الموقع GPS</button>
            <input type="hidden" id="gpsLink" value="لم يشارك">
            <button onclick="submitOrder()" id="subBtn" class="w-full bg-black text-white p-4 rounded-xl font-bold">إرسال عبر واتساب</button>
            <button onclick="document.getElementById('orderModal').style.display='none'" class="w-full text-gray-400 mt-4 text-sm text-center">إلغاء</button>
        </div>
    </div>

    <script>
        let cart = [], total = 0, currentBasePrice = 0, veilExtra = 0, payMethod = '';
        let selectedOptions = { size: '', wrap: '', veil: '' };
        const scriptURL = "https://script.google.com/macros/s/AKfycbxjMePwUNHZW_X7FjtrnapR6JOMtUuoxXlDLHky54n3pNh2muwBcfB_LPn9eV71g4K7/exec";

        function toggleCartDrawer() {
            const d = document.getElementById('cartDrawer');
            d.style.display = (d.style.display === 'flex') ? 'none' : 'flex';
            renderCart();
        }

        function openProductDetail(name, old, price, imgs, desc) {
            currentBasePrice = price; veilExtra = 0;
            selectedOptions = { size: '', wrap: '', veil: '' };
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('productDescription').innerText = desc;
            document.getElementById('modalOldPrice').innerText = old + " ريال";
            document.getElementById('modalSlider').innerHTML = imgs.map(i => `<img src="${i}" class="w-full flex-shrink-0 snap-center object-cover">`).join('');
            document.getElementById('sizeOptions').innerHTML = [48, 50, 52, 54, 56, 58, 60].map(s => `<button onclick="selectOption('size', '${s}', this)" class="opt-btn w-10 h-10 rounded-full text-xs">${s}</button>`).join('');
            updateModalPrice();
            document.getElementById('productDetailModal').style.display = 'block';
            
            document.getElementById('modalAddBtn').onclick = () => {
                if(!selectedOptions.size || !selectedOptions.wrap || !selectedOptions.veil) return alert("يرجى اختيار كل الخيارات");
                cart.push({ name: `${name} (${selectedOptions.wrap}/${selectedOptions.veil})`, price: currentBasePrice + veilExtra, size: selectedOptions.size, qty: 1, image: imgs[0] });
                updateUI(); closeProductDetail(); toggleCartDrawer();
            };
        }

        function selectOption(type, val, btn) {
            selectedOptions[type] = val;
            if(type === 'veil') { veilExtra = (val === 'مطرزة' ? 19 : 0); updateModalPrice(); }
            Array.from(btn.parentElement.children).forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        function updateModalPrice() { document.getElementById('modalPrice').innerText = (currentBasePrice + veilExtra) + " ريال"; }
        function closeProductDetail() { document.getElementById('productDetailModal').style.display = 'none'; }
        function updateUI() {
            total = cart.reduce((s, i) => s + i.price, 0);
            document.getElementById('total-price').innerText = total;
            document.getElementById('inner-total').innerText = total;
            document.getElementById('cartCount').innerText = cart.length;
        }

        function renderCart() {
            const list = document.getElementById('cartItemsList');
            list.innerHTML = cart.length ? cart.map((i, idx) => `<div class="flex justify-between items-center mb-3"><span>${i.name} (مقاس:${i.size})</span><button onclick="cart.splice(${idx},1);updateUI();renderCart()" class="text-red-500">×</button></div>`).join('') : "السلة فارغة";
        }

        function openOrderModal() {
            if(!cart.length) return alert("السلة فارغة!");
            document.getElementById('orderModal').style.display = 'flex';
        }

        function setPay(m) {
            payMethod = m;
            document.getElementById('btnT').style.background = m === 'transfer' ? '#eee' : 'white';
            document.getElementById('btnC').style.background = m === 'cod' ? '#eee' : 'white';
        }

        function getGPS() {
            navigator.geolocation.getCurrentPosition(p => {
                document.getElementById('gpsLink').value = `https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`;
                document.getElementById('gpsBtn').innerText = "✅ تم تحديد الموقع";
            });
        }

        function submitOrder() {
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            if(!name || !phone || !payMethod) return alert("أكمل البيانات");

            const items = cart.map(i => `- ${i.name} (مقاس:${i.size})`).join('\n');
            const msg = `طلب جديد من: ${name}\nالجوال: ${phone}\nالموقع: ${document.getElementById('gpsLink').value}\n\nالمنتجات:\n${items}\n\nالإجمالي: ${total} ريال\nطريقة الدفع: ${payMethod}`;
            
            // إرسال للواتساب
            window.open(`https://wa.me/966502743396?text=${encodeURIComponent(msg)}`);
            
            // إرسال لـ Google Sheets (اختياري)
            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ name, phone, items, total }) });
        }
    </script>
</body>
</html>
